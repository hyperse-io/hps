name: github pages

on:
  push:
    branches:
      - main
    # Only redeploy when the site, its content, or the workflow itself changes.
    paths:
      - '.github/workflows/gh-pages.yml'
      - 'website/**'
      - 'packages/**'
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js Environment
        uses: ./.github/actions/node-env
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📥 Install Dependencies
        run: yarn --frozen-lockfile

      - name: Unit tests
        run: yarn workspace @hyperse/hps-website run test

      - name: Build packages
        # The docs use Twoslash, which resolves types from the workspace
        # packages' `dist/*.d.ts`, so they must be built before the website.
        run: yarn g:build-local

      - name: Build website
        run: yarn g:build-website

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.head_ref, 'changeset-release/') }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
